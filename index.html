<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpapers-Anime-HD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #151522;
      --accent: #ff4d8d;
      --accent2: #7c5cff;
      --text: #f0f0f8;
      --muted: #8888a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 {
      text-align: center;
      font-size: 2.1rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2.5rem;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.3rem;
      max-width: 1300px;
      margin: 0 auto;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #2a2a40;
      transition: transform 0.25s;
    }
    .card:hover { transform: translateY(-5px); }
    .preview {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .card-body { padding: 0.9rem 1rem; }
    .name {
      font-size: 0.88rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.4rem;
    }
    .actions a {
      display: block;
      text-align: center;
      background: var(--accent2);
      color: white;
      text-decoration: none;
      padding: 0.45rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 4rem;
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <h1>Wallpapers-Anime-HD</h1>
  <p class="subtitle">Wallpapers en alta calidad • Descarga gratis</p>

  <div class="gallery" id="gallery">
    <div class="empty">Cargando wallpapers...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://amnrrgtkxsnrgwvbvpsk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AU7FMILgl0Dye6oQOga6BA_RVgZdSEp";
    const BUCKET = "wallpapers";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadGallery() {
      const gallery = document.getElementById("gallery");
      const { data, error } = await supabaseClient.storage.from(BUCKET).list("", {
        limit: 300,
        sortBy: { column: "created_at", order: "desc" }
      });

      if (error || !data || data.length === 0) {
        gallery.innerHTML = '<div class="empty">Todavía no hay wallpapers</div>';
        return;
      }

      gallery.innerHTML = "";
      data.forEach(file => {
        if (file.name === ".emptyFolderPlaceholder") return;

        const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(file.name);
        const url = urlData.publicUrl;
        const isImage = /\.(webp|jpg|jpeg|png|gif)$/i.test(file.name);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          ${isImage 
            ? `<img class="preview" src="${url}" alt="${file.name}" loading="lazy">`
            : `<video class="preview" src="${url}" muted loop playsinline></video>`
          }
          <div class="card-body">
            <div class="name" title="${file.name}">${file.name}</div>
            <div class="actions">
              <a href="${url}" download="${file.name}" target="_blank">Descargar</a>
            </div>
          </div>
        `;
        gallery.appendChild(card);
      });
    }

    loadGallery();
  </script>
</body>
</html>
