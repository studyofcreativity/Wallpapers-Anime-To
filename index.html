<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wallpapers-Anime-HD</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0b12;
      --card: #151522;
      --accent: #ff4d8d;
      --accent2: #7c5cff;
      --text: #f0f0f8;
      --muted: #8888a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1.5rem;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.3rem;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .panel {
      background: var(--card);
      border-radius: 16px;
      padding: 1.4rem;
      margin-bottom: 2rem;
      border: 1px solid #2a2a40;
    }
    .panel h2 { font-size: 1.1rem; margin-bottom: 1rem; }
    input, button {
      font-size: 0.95rem;
      border-radius: 8px;
      border: none;
      padding: 0.65rem 1rem;
    }
    input[type="email"], input[type="password"], input[type="file"] {
      background: #0f0f1a;
      color: var(--text);
      border: 1px solid #333;
      width: 100%;
      max-width: 280px;
    }
    button {
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: #333; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .row { display: flex; gap: 0.8rem; flex-wrap: wrap; align-items: center; }
    .status { margin-top: 0.8rem; font-size: 0.9rem; color: var(--muted); }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.2rem;
    }
    .card {
      background: var(--card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a40;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-4px); }
    .preview {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      background: #111;
      display: block;
    }
    .card-body { padding: 0.8rem 1rem; }
    .name {
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.3rem;
    }
    .meta { font-size: 0.75rem; color: var(--muted); }
    .actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
    .actions a, .actions button {
      flex: 1;
      text-align: center;
      font-size: 0.8rem;
      padding: 0.4rem;
      text-decoration: none;
      border-radius: 6px;
    }
    .actions a { background: var(--accent2); color: white; }
    .actions button.danger { background: #c0392b; }
    .empty { text-align: center; color: var(--muted); padding: 3rem; grid-column: 1 / -1; }
    .hidden { display: none; }
    .progress {
      height: 4px;
      background: #222;
      border-radius: 2px;
      margin-top: 0.8rem;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Wallpapers-Anime-HD</h1>
    <p class="subtitle">Solo el dueño puede subir • Imágenes convertidas a WebP automáticamente</p>

    <!-- LOGIN -->
    <div class="panel" id="loginPanel">
      <h2>Iniciar sesión (solo dueño)</h2>
      <div class="row">
        <input type="email" id="email" placeholder="Tu correo" />
        <input type="password" id="password" placeholder="Contraseña" />
        <button id="btnLogin">Entrar</button>
      </div>
      <div class="status" id="loginStatus"></div>
    </div>

    <!-- SUBIDA (solo visible cuando estás logueado) -->
    <div class="panel hidden" id="uploadPanel">
      <h2>Subir wallpapers</h2>
      <div class="row">
        <input type="file" id="files" multiple accept="image/*,video/*" />
        <button id="btnUpload">Subir</button>
        <button class="secondary" id="btnLogout">Cerrar sesión</button>
      </div>
      <div class="progress" id="progress"><div class="progress-bar" id="progressBar"></div></div>
      <div class="status" id="uploadStatus"></div>
    </div>

    <!-- GALERÍA -->
    <div class="gallery" id="gallery">
      <div class="empty">Cargando wallpapers...</div>
    </div>
  </div>

  <script>
    // ====== TUS DATOS ======
    const SUPABASE_URL = "https://amnrrgtkxsnrgwvbvpsk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_AU7FMILgl0Dye6oQOga6BA_RVgZdSEp";
    const BUCKET = "wallpapers";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Elementos
    const loginPanel = document.getElementById("loginPanel");
    const uploadPanel = document.getElementById("uploadPanel");
    const gallery = document.getElementById("gallery");
    const loginStatus = document.getElementById("loginStatus");
    const uploadStatus = document.getElementById("uploadStatus");
    const progress = document.getElementById("progress");
    const progressBar = document.getElementById("progressBar");

    // Comprobar si ya hay sesión
    async function checkSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        loginPanel.classList.add("hidden");
        uploadPanel.classList.remove("hidden");
      } else {
        loginPanel.classList.remove("hidden");
        uploadPanel.classList.add("hidden");
      }
    }

    // Login
    document.getElementById("btnLogin").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      loginStatus.textContent = "Entrando...";
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        loginStatus.textContent = "Error: " + error.message;
      } else {
        loginStatus.textContent = "¡Bienvenido!";
        checkSession();
      }
    };

    // Logout
    document.getElementById("btnLogout").onclick = async () => {
      await supabase.auth.signOut();
      checkSession();
    };

    // Convertir imagen a WebP comprimido
    async function toWebP(file, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          let w = img.width;
          let h = img.height;
          const max = 3840;
          if (w > max || h > max) {
            if (w > h) { h = Math.round(h * max / w); w = max; }
            else { w = Math.round(w * max / h); h = max; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            URL.revokeObjectURL(url);
            if (!blob) return reject("Error al convertir");
            const name = file.name.replace(/\.[^.]+$/, "") + ".webp";
            resolve(new File([blob], name, { type: "image/webp" }));
          }, "image/webp", quality);
        };
        img.onerror = () => reject("No se pudo cargar la imagen");
        img.src = url;
      });
    }

    // Subir archivos
    document.getElementById("btnUpload").onclick = async () => {
      const files = Array.from(document.getElementById("files").files);
      if (!files.length) return alert("Selecciona archivos");

      document.getElementById("btnUpload").disabled = true;
      progress.style.display = "block";
      let done = 0;

      for (const file of files) {
        try {
          let toUpload = file;
          if (file.type.startsWith("image/")) {
            uploadStatus.textContent = `Comprimiendo ${file.name}...`;
            toUpload = await toWebP(file, 0.72);
          }
          uploadStatus.textContent = `Subiendo ${toUpload.name}...`;
          const { error } = await supabase.storage
            .from(BUCKET)
            .upload(toUpload.name, toUpload, { upsert: true });
          if (error) throw error;
          done++;
          progressBar.style.width = (done / files.length * 100) + "%";
        } catch (e) {
          uploadStatus.textContent = "Error: " + e.message;
          document.getElementById("btnUpload").disabled = false;
          return;
        }
      }
      uploadStatus.textContent = `¡Listo! Se subieron ${done} archivo(s)`;
      document.getElementById("files").value = "";
      progress.style.display = "none";
      progressBar.style.width = "0%";
      document.getElementById("btnUpload").disabled = false;
      loadGallery();
    };

    // Cargar galería
    async function loadGallery() {
      gallery.innerHTML = '<div class="empty">Cargando...</div>';
      const { data, error } = await supabase.storage.from(BUCKET).list("", {
        limit: 200,
        sortBy: { column: "created_at", order: "desc" }
      });
      if (error || !data || data.length === 0) {
        gallery.innerHTML = '<div class="empty">Todavía no hay wallpapers</div>';
        return;
      }

      gallery.innerHTML = "";
      for (const file of data) {
        if (file.name === ".emptyFolderPlaceholder") continue;
        const { data: urlData } = supabase.storage.from(BUCKET).getPublicUrl(file.name);
        const url = urlData.publicUrl;
        const isImage = /\.(webp|jpg|jpeg|png|gif)$/i.test(file.name);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          ${isImage
            ? `<img class="preview" src="${url}" alt="${file.name}" loading="lazy">`
            : `<video class="preview" src="${url}" muted loop playsinline></video>`
          }
          <div class="card-body">
            <div class="name" title="${file.name}">${file.name}</div>
            <div class="meta">${(file.metadata?.size / 1024 / 1024 || 0).toFixed(2)} MB</div>
            <div class="actions">
              <a href="${url}" download="${file.name}" target="_blank">Descargar</a>
              <button class="danger btn-delete" data-name="${file.name}">Borrar</button>
            </div>
          </div>
        `;
        gallery.appendChild(card);
      }

      // Botones borrar (solo funcionan si estás logueado)
      document.querySelectorAll(".btn-delete").forEach(btn => {
        btn.onclick = async () => {
          if (!confirm("¿Borrar este wallpaper?")) return;
          const name = btn.dataset.name;
          const { error } = await supabase.storage.from(BUCKET).remove([name]);
          if (error) alert("Error al borrar: " + error.message);
          else loadGallery();
        };
      });
    }

    // Iniciar
    checkSession();
    loadGallery();
  </script>
</body>
</html>
